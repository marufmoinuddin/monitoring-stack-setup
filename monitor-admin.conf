server {
    listen 443 ssl;
    http2 on;
    server_name monitor-admin.monitor.example.com;

    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;

    # The panel mints SSH keys and reports your server address and device
    # inventory. DENY framing and no-referrer keep it out of other pages.
    add_header X-Frame-Options        "DENY"        always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "no-referrer" always;

    # A dashboard that is usually idle: a tight limit on the whole vhost, so a
    # stuck client cannot hold connections open.
    limit_req  zone=auth burst=20 nodelay;
    limit_conn conn_per_ip 10;

    # The panel listens on the Docker bridge gateway, NOT on 127.0.0.1.
    # A container's loopback is itself, so nginx can never reach a host
    # service bound to 127.0.0.1. The gateway is not routable from outside:
    # the firewall has no rule for it, so the only path in is nginx on 443.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://GATEWAY_IP:8099;

    # Never cache: the page shows live device state and one-shot commands.
    add_header Cache-Control "no-store" always;

    location = /healthz {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    # The installer the one-liner fetches.
    location = /install.sh {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if ($bad_bot) { return 403; }

        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name monitor-admin.monitor.example.com;
    return 301 https://$host$request_uri;
}